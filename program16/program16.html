<!DOCTYPE html>
<html>
<head>
<title>JavaScript Output</title>
</head>
<body>

<h2>JavaScript Output Methods</h2>

<p id="output"></p>

<script>
// 1. Using innerHTML
document.getElementById("output").innerHTML =
"1. Output using innerHTML";

// 2. Using document.write()
document.write("<br>2. Output using document.write()");

// 3. Using alert()
window.alert("<br> 3. Output using alert()");

// 4. Using console.log()
console.log("<br> 4. Output using console.log()");
</script>

</body>
</html>
