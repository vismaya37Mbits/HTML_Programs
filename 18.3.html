<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beautiful Background Changer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: left;
            align-items: center;
            background: white;
            background-size: cover;
            background-position: center;
            transition: background 0.6s ease;
        }

        .container {
            width: 50%;
            max-width: 700px;
            padding: 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 25px;
            color: #444;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        /* Color buttons */
        .red {
            background: #ff4757;
        }

        .blue {
            background: #1e90ff;
        }

        .green {
            background: #2ed573;
        }

        .purple {
            background: #a55eea;
        }

        .orange {
            background: #ff7f50;
        }

        .pink {
            background: #ff69b4;
        }

        /* Image buttons */
        .image1 {
            background: #3742fa;
        }

        .image2 {
            background: #2f3542;
        }

        .image3 {
            background: #16a085;
        }

        .image4 {
            background: #8e44ad;
        }

        .gradient {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        .reset {
            background: #333;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Background Changer</h1>
        <p>Choose your favorite color, gradient, or image!</p>

        <h2>🌈 Colors</h2>

        <div class="buttons">
            <button class="red" onclick="changeColor('#ff4757')">
                ❤️ Red
            </button>

            <button class="blue" onclick="changeColor('#1e90ff')">
                💙 Blue
            </button>

            <button class="green" onclick="changeColor('#2ed573')">
                💚 Green
            </button>

            <button class="purple" onclick="changeColor('#a55eea')">
                💜 Purple
            </button>

            <button class="orange" onclick="changeColor('#ff7f50')">
                🧡 Orange
            </button>

            <button class="pink" onclick="changeColor('#ff69b4')">
                💗 Pink
            </button>
        </div>

        <h2>✨ Special Effects</h2>

        <div class="buttons">
            <button class="gradient" onclick="changeGradient()">
                🌈 Gradient
            </button>
        </div>

        <h2>🖼️ Background Images</h2>

        <div class="buttons">
            <button class="image1" onclick="changeImage(1)">
                🌄 Mountain
            </button>

            <button class="image2" onclick="changeImage(2)">
                🌊 Ocean
            </button>

            <button class="image3" onclick="changeImage(3)">
                🌲 Forest
            </button>

            <button class="image4" onclick="changeImage(4)">
                🌌 Space
            </button>
        </div>

        <button class="reset" onclick="resetBackground()">
            🔄 Return to Normal
        </button>

    </div>

    <script>

        const originalColor = "white";
        const originalImage = "";

        // Change background color
        function changeColor(color) {
            document.body.style.backgroundImage = "none";
            document.body.style.backgroundColor = color;
        }

        // Gradient background
        function changeGradient() {
            document.body.style.backgroundImage =
                "linear-gradient(135deg, #ff416c, #ff4b2b, #7b2ff7)";
        }

        // Change background image
        function changeImage(number) {

            document.body.style.backgroundColor = "";

            if (number === 1) {
                document.body.style.backgroundImage =
                    "url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80')";
            }

            else if (number === 2) {
                document.body.style.backgroundImage =
                    "url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80')";
            }

            else if (number === 3) {
                document.body.style.backgroundImage =
                    "url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=80')";
            }

            else if (number === 4) {
                document.body.style.backgroundImage =
                    "url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1600&q=80')";
            }
        }

        // Reset background
        function resetBackground() {
            document.body.style.backgroundColor = originalColor;
            document.body.style.backgroundImage = originalImage;
        }

    </script>

</body>
</html>
